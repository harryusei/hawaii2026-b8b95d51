<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A7EA4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ふたりのハワイ">
<title>ふたりのハワイ</title>
<!--INLINE:css--><link rel="stylesheet" href="styles.css"><!--/INLINE-->
</head>
<body>
<header class="bar">
  <a class="brand" href="#today">ふたりのハワイ</a>
  <div class="clocks" aria-label="現在時刻">
    <span class="clock"><span class="clock-label">ハワイ</span><b id="clock-hst">--:--</b></span>
    <span class="clock"><span class="clock-label">日本</span><b id="clock-jst">--:--</b></span>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="メニュー">
  <a href="#today" data-tab="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
    <span>今日</span>
  </a>
  <a href="#days" data-tab="days">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>日程</span>
  </a>
  <a href="#places" data-tab="places">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.4"/></svg>
    <span>地図</span>
  </a>
  <a href="#info" data-tab="info">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/></svg>
    <span>情報</span>
  </a>
</nav>

<!--INLINE:js--><script src="data.js"></script><script src="app.js"></script><!--/INLINE-->
</body>
</html>
